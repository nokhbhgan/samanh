.homebtn{flex:0 0 auto;width:42px;height:42px;border-radius:14px;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(145deg,#5ba8e6,#2b57a7);box-shadow:0 8px 18px -8px rgba(43,87,167,.75);transition:transform .15s,box-shadow .15s}
.homebtn:hover{transform:translateY(-2px);box-shadow:0 12px 22px -8px rgba(43,87,167,.85)}.homebtn:active{transform:scale(.95)}.homebtn:focus-visible{outline:3px solid rgba(43,87,167,.4);outline-offset:2px}
.sv{border-collapse:separate;border-spacing:5px;width:100%;min-width:680px;table-layout:fixed}
.sv th{border:1px solid var(--line);padding:9px 6px;border-radius:10px;background:rgba(43,87,167,.1);font-size:13px;font-weight:800}.sv th.today{background:#2b57a7;color:#fff}
.sv td{vertical-align:top;padding:0;height:64px;border-radius:10px;border:1px solid var(--line)}.sv td.today{background:rgba(43,87,167,.07)}
.tile .ti{position:relative}.tile{position:relative}
.cnt{position:absolute;top:-6px;inset-inline-start:calc(50% + 14px);min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:#2b57a7;color:#fff;font-size:12.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 4px 10px -3px rgba(0,0,0,.45);border:2px solid var(--card,#fff);line-height:1}
.cnt.warn{background:#e11d48}.cnt.zero{background:#94a3b8}
.tilew{touch-action:manipulation;-webkit-user-select:none;user-select:none;cursor:grab}.tilew.drag-src{opacity:.25}
.tilew.drag-clone{position:fixed;z-index:200;margin:0;pointer-events:none;cursor:grabbing;opacity:.95;transform:scale(1.08);filter:drop-shadow(0 14px 18px rgba(0,0,0,.3))}
.tiles.dragging .tile{pointer-events:none}.tiles.dragging{cursor:grabbing}

.soon{margin:16px 0 6px;cursor:pointer}.soon h3{margin:0 0 8px;font-size:16px}
.soon-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.soon-c{background:var(--g);color:#fff;border-radius:14px;padding:9px 10px 8px;display:flex;flex-direction:column;gap:2px;box-shadow:0 8px 16px -12px rgba(0,0,0,.5);position:relative;overflow:hidden}
.soon-c .sk{font-size:10.5px;font-weight:700;background:rgba(255,255,255,.25);border-radius:999px;padding:1px 8px;align-self:flex-start}
.soon-c .sn{font-size:15px;line-height:1.35;margin-top:2px}.soon-c .ss{font-size:11.5px;opacity:.92}.soon-c .sd{font-size:11.5px;opacity:.95}
.soon-c .scd{margin-top:5px;font-size:15px;font-weight:900;background:rgba(0,0,0,.22);border-radius:10px;padding:3px 8px;text-align:center}
.soon-c.hot{outline:2px solid rgba(225,29,72,.85);outline-offset:1px}
.soon-empty{margin:16px 0 4px;padding:12px 14px;border-radius:14px;background:var(--info-bg);color:var(--info);font-size:14px;cursor:pointer}

.dpx{border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;padding:0 8px;cursor:pointer}
.alb{margin-top:14px;border:1px solid var(--line);border-radius:14px;padding:4px 14px 10px;background:var(--card)}.alb summary{cursor:pointer;font-weight:700;padding:8px 0;color:var(--warn)}.alb .note{margin-top:8px!important}
.fresh .tri button.on{opacity:.45}
.rkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:12px}.rkc{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:14px 10px;border:1px solid var(--line);border-top:3px solid var(--c);border-radius:14px;background:var(--card)}
.dsring{--p:100;--c:#16a34a;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;position:relative;flex:none}.dsring::before{content:"";position:absolute;inset:11%;border-radius:50%;background:var(--card)}.dsring b,.dsring small{position:relative;line-height:1.1}.dsring b{font-size:1.25em;color:var(--c)}.dsring small{font-size:.62em;color:var(--muted)}
.dscard{display:flex;align-items:center;gap:12px;width:100%;margin:10px 0;padding:10px 14px;border:1px solid var(--line);border-inline-start:6px solid var(--c);border-radius:14px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer;text-align:start}.dscard .dsct{display:flex;flex-direction:column;gap:2px;flex:1}.dscard .dsct span{color:var(--c);font-weight:700;font-size:.9em}.dscard .dsgo{color:var(--muted);font-size:.8em}
.dsbig{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:12px;border:1px solid var(--line);border-inline-start:6px solid var(--c);border-radius:14px;margin:8px 0}.dsleg{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.dsleg span{padding:2px 10px;border-radius:99px;font-size:.76em;border:1px solid var(--c);color:var(--c);font-weight:700}
.dspill{display:inline-block;min-width:44px;text-align:center;padding:2px 8px;border-radius:99px;border:1px solid var(--c);color:var(--c);font-weight:700}.dvoid td{opacity:.62}
.trsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:6px 0 10px}.trsum>div{border:1px solid var(--line);border-inline-start:4px solid var(--c);border-radius:10px;padding:6px 10px;background:var(--card);display:flex;flex-direction:column;gap:1px}.trsum span{font-size:.72em;color:var(--muted)}.trsum b{font-size:.92em}
.trgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px;margin-bottom:10px}.trc{display:grid;grid-template-columns:1fr auto;gap:2px 6px;align-items:center;border:1px solid var(--line);border-bottom:3px solid var(--c);border-radius:10px;background:var(--card);color:var(--ink);padding:6px 8px;font:inherit;cursor:pointer;text-align:start}.trc.on{box-shadow:0 0 0 2px var(--c) inset}.trn{font-size:.82em;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.trm{font-size:.82em;font-weight:700;color:var(--c)}.trc svg{grid-column:1/-1;width:100%}
.trdet{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--card)}.trh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px}.trins{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:.82em;margin:6px 0;color:var(--muted)}.trins b{color:var(--ink)}.trins small{opacity:.8}.trdt summary{cursor:pointer;font-size:.85em;margin-top:6px;color:var(--accent)}
.pvc{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--card)}.pvh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pvok{display:flex;flex-direction:column;gap:2px;border:1px solid var(--ok);border-inline-start:6px solid var(--ok);background:var(--ok-bg);border-radius:12px;padding:10px 12px;margin:8px 0}.pvat{font-weight:700;color:var(--ok)}
#print .rc{border:2px solid #1e3a5f;border-radius:10px;padding:3mm 4mm;page:rcp;break-inside:avoid;break-after:page;font-size:11px;line-height:1.5}
#print .rc .rc-h{padding:5px 10px;margin-bottom:6px}#print .rc .rc-h img{width:52px;height:52px}#print .rc .info{font-size:11.5px;margin-bottom:4px;padding:4px 10px}
#print .rc table.rcm th,#print .rc table.rcm td{padding:2px 5px;font-size:11px}#print .rc table.rcm small{font-size:8.5px}#print .rc .sc{min-width:30px;padding:0 5px}
#print .rc .rcchart{max-height:56mm}#print .rc .rcleg{margin-top:4px}

    } else if (IN_GAS) {
      const txt = await gasCall(body);
      try { j = JSON.parse(txt); } catch (e) { throw new Error('پاسخ سرور نامعتبر است.'); }
    } else {
      let res;
      try { res = await fetch(SCRIPT_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body }); }
      catch (e) { throw new Error(NET_ERR); }
      try { j = await res.json(); } catch (e) { throw new Error('پاسخ سرور نامعتبر است.'); }

  jy += 4 * Math.floor(days / 1461); days %= 1461;
  if (days > 365) { jy += Math.floor((days - 1) / 365); days = (days - 1) % 365; }
  const jm = days < 186 ? 1 + Math.floor(days / 31) : 7 + Math.floor((days - 186) / 30);
  const jd = 1 + (days < 186 ? days % 31 : (days - 186) % 30);

}

  const ml = [0, 31, (gy % 4 === 0 && gy % 100 !== 0) || gy % 400 === 0 ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  for (gm = 0; gm < 13 && gd > ml[gm]; gm++) gd -= ml[gm];
  return [gy, gm, gd];
}

function fileToImg(file, mx, lim, png) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      let w = img.width, h = img.height; if (Math.max(w, h) > mx) { const k = mx / Math.max(w, h); w = Math.round(w * k); h = Math.round(h * k); }
      let q = 0.85, out = '', usePng = png;
      for (let t = 0; t < 10; t++) {
        const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d');
        if (!usePng) { x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); }
        x.drawImage(img, 0, 0, w, h);
        out = usePng ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', q);
        if (out.length <= lim) break;
        if (usePng && t >= 2) usePng = false; else if (usePng) { w = Math.round(w * 0.8); h = Math.round(h * 0.8); }
        else { q = Math.max(0.45, q - 0.1); w = Math.round(w * 0.88); h = Math.round(h * 0.88); }
      }
      URL.revokeObjectURL(url); out.length <= lim ? res(out) : rej(new Error('حجم تصویر زیاد است؛ تصویر کوچک‌تری انتخاب کنید.'));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('این فایل تصویر نیست.')); };
    img.src = url;
  });
}

function attAgg(ses, att, from, to) {
  const per = {}, P = c => per[c] || (per[c] = { s:0, a:0, l:0 }), inR = d => d >= from && d <= to;
  ses.forEach(x => { if (inR(x.date)) P(x.course).s++; });
  att.forEach(x => { if (inR(x.date)) { const p = P(x.course); if (x.status === 'غایب') p.a++; else p.l++; } });
  const tot = { s:0, a:0, l:0 };
  Object.keys(per).forEach(k => { tot.s += per[k].s; tot.a += per[k].a; tot.l += per[k].l; });
  return { per, tot };
}
const pct = (s, a) => s ? Math.max(0, Math.round((s - a) / s * 100)) + '٪' : '—';
function attTable(per) {
  const cs = Object.keys(per).sort(byFa);
  if (!cs.length) return '<div class="empty">در این بازه حضور و غیابی ثبت نشده است.</div>';
  return `<div class="scroll"><table class="tbl stack"><thead><tr><th>درس</th><th>جلسات</th><th>غیبت</th><th>تأخیر</th><th>حضور</th></tr></thead><tbody>
    ${cs.map(c => { const p = per[c]; return `<tr><td data-l="درس"><b>${esc(c)}</b></td><td data-l="جلسات" class="num">${p.s}</td>
      <td data-l="غیبت">${p.a ? `<span class="pill bad">${p.a}</span>` : '۰'}</td><td data-l="تأخیر">${p.l ? `<span class="pill warn">${p.l}</span>` : '۰'}</td><td data-l="حضور" class="num">${pct(p.s, p.a)}</td></tr>`; }).join('')}
  </tbody></table></div>`;
}

/* ---------- خروجی اکسل (CSV با UTF-8 و BOM؛ در اکسل مستقیم باز می‌شود) ---------- */
function csvExport(name, head, rows) {
  const q = v => { v = v == null ? '' : String(v); return /[",\n\r;]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const txt = '﻿' + [head].concat(rows).map(r => r.map(q).join(',')).join('\r\n');
  try {
    const url = URL.createObjectURL(new Blob([txt], { type:'text/csv;charset=utf-8' })), a = document.createElement('a');
    a.href = url; a.download = name.replace(/[\\/:*?"<>|]+/g, ' ') + '.csv'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast('فایل اکسل (CSV) ساخته شد.');
  } catch (e) {                                    // اگر مرورگر دانلود را مسدود کرد: متن برای کپی در اکسل
    dialog(`<h3>خروجی اکسل</h3><p class="muted small">دانلود در این مرورگر ممکن نشد. متن زیر را کپی کنید و در اکسل Paste کنید.</p><textarea id="csvT" rows="10" style="width:100%;direction:ltr"></textarea><div class="dlg-actions"><button class="btn" data-close type="button">بستن</button></div>`, d => { $('#csvT', d).value = [head].concat(rows).map(r => r.join('\t')).join('\n'); });
  }
}

/* ---------- جدول ماتریسی و نمودار میله‌ای (مشترک) ---------- */
const cShort = (n, all) => {                      // عنوان کوتاه درس برای سرستون جدول‌ها: فقط کلمه‌ی اول (اگر با درس دیگری یکی نشود)
  n = String(n == null ? '' : n).trim();
  const f = n.split(/\s+/)[0] || n;
  return f !== n && (all || []).filter(x => String(x).trim().split(/\s+/)[0] === f).length < 2 ? f : n;
};
const vth = (n, all, sub) => { n = String(n == null ? '' : n); const t = cShort(n, all); return `<th class="vh" title="${esc(n)}"><div class="vt">${esc(t.length > 18 ? t.slice(0, 17) + '…' : t)}</div>${sub ? `<small>${sub}</small>` : ''}</th>`; };   // سرستون عمودی برای نام درس
const thC = (n, all) => vth(n, all);
const mcell = (t, c) => `<td class="mc${c ? ' ' + c : ''}">${t == null ? '' : t}</td>`;
function matrix(head, rows, o) {                   // head: عنوان ستون‌ها (html)؛ rows: [{l, cells:[html | {t,c}]}]؛ o.foot: {l, cells}
  o = o || {};
  const cl = c => c && typeof c === 'object' ? mcell(c.t, c.c) : mcell(c);
  return `<div class="scroll"><table class="tbl mx"><thead><tr><th class="mh">${o.corner || ''}</th>${head.map(h => { const long = String(h).replace(/<[^>]*>/g, '').length > 8; return `<th class="mc${long ? ' vh' : ''}">${long ? `<div class="vt">${h}</div>` : h}</th>`; }).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr><th class="mh">${r.l}</th>${r.cells.map(cl).join('')}</tr>`).join('')}</tbody>
    ${o.foot ? `<tfoot><tr><th class="mh">${o.foot.l}</th>${o.foot.cells.map(cl).join('')}</tr></tfoot>` : ''}</table></div>`;
}
function hbars(items, o) {                         // items: [{l, v}]؛ o.max (پیش‌فرض ۲۰)، o.mark / o.markL: خط مرجع (مثلاً معدل)
  o = o || {};
  const mx = o.max || 20;
  if (!items.length) return '';
  return `<div class="hbs">${items.map(x => {
    const r = Math.max(0, Math.min(1, x.v / mx)), k = r >= .75 ? 'ok' : r >= .5 ? 'warn' : 'bad';
    return `<div class="hb"><span class="hl">${esc(x.l)}</span><div class="tr"><i class="br ${k}" style="width:${(r * 100).toFixed(1)}%"></i>${o.mark != null ? `<s class="mk" style="inset-inline-start:${(Math.max(0, Math.min(1, o.mark / mx)) * 100).toFixed(1)}%"></s>` : ''}</div><b class="hv num">${nf(x.v)}</b></div>`;
  }).join('')}</div>${o.mark != null ? `<p class="muted small">خط عمودی: ${esc(o.markL || 'میانگین')} (${nf(o.mark)})</p>` : ''}`;
}
// کارنامه: میانگین هر درس (از ۲۰) و معدل وزنی با ضریب‌هایی که مدیر تعیین کرده
function cardData(d, term) {
  const coef = {};
  (d.coefs || []).forEach(c => coef[norm(c.course)] = c.coef);
  const by = {};
  d.grades.filter(g => g.date >= term.from && g.date <= term.to).forEach(g => (by[g.course] = by[g.course] || []).push(g.score / g.max * 20));
  const rows = Object.keys(by).sort(byFa).map(c => {
    const v = by[c], avg = v.reduce((a, b) => a + b, 0) / v.length, has = coef[norm(c)] != null;
    return { course:c, n:v.length, avg, coef:has ? coef[norm(c)] : 1, set:has };
  });
  const used = rows.filter(r => r.coef > 0), sumC = used.reduce((a, r) => a + r.coef, 0);
  const gpa = sumC ? used.reduce((a, r) => a + r.avg * r.coef, 0) / sumC : null;
  const ab = attAgg(d.ses || [], d.att || [], term.from, term.to).tot;
  return { rows, sumC, gpa, ab };
}

const stSeenK = d => 'stSeen_' + d.user.code;
function stKeys(d, k) {
  const c = d.cnt || {};
  if (k === 'att') return (d.att || []).map(x => [x.date, x.course, x.status].join('|'));
  if (k === 'gr') return (d.grades || []).map(x => [x.course, x.title, x.date, x.score].join('|'));
  if (k === 'jam') return (d.jamea || []).concat(d.ins || []).map(x => JSON.stringify(x).slice(0, 160));
  if (k === 'fac') return c.fac || [];
  if (k === 'exm' || k === 'dsc') return Number(c[k]) || 0;

}
function stNew(d, k, mark) {
  const cur = stKeys(d, k);
  return cur == null ? null : seenNew(stSeenK(d), k, cur, mark);
}
function seenNew(sk, k, cur, mark) {               // mark=true یعنی کاربر بخش را باز کرد؛ cur عدد یا فهرست کلید
  let sn; try { sn = store.get(sk) || {}; } catch (e) { sn = {}; }
  const had = sn[k] !== undefined, num = typeof cur === 'number';
  let n = 0;
  if (!had || mark) sn[k] = cur;
  else if (num) { if (cur < sn[k]) sn[k] = cur; n = cur - sn[k]; }
  else n = cur.filter(x => sn[k].indexOf(x) < 0).length;
  try { store.set(sk, sn); } catch (e) {}
  return n;
}

  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      let w = img.width, h = img.height, mx = 1500; if (Math.max(w, h) > mx) { const k = mx / Math.max(w, h); w = Math.round(w * k); h = Math.round(h * k); }
      let q = 0.8, out = '';
      for (let t = 0; t < 8; t++) {
        const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h);
        out = c.toDataURL('image/jpeg', q); if (out.length <= 480000) break;
        q = Math.max(0.4, q - 0.1); w = Math.round(w * 0.85); h = Math.round(h * 0.85);
      }
      URL.revokeObjectURL(url); out.length <= 500000 ? res(out) : rej(new Error('حجم تصویر زیاد است.'));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('این فایل تصویر نیست؛ عکس کارنامه را انتخاب کنید.')); };
    img.src = url;
  });
}

/* --- افزودن تکی و گروهی، رمزها (مشترک برای دانش‌آموز، دبیر و مدیر) --- */
function parseBulk(text, cls) {
  return text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
    const p = l.split(/\t|,|،|;|؛/).map(x => x.trim());
    return { code:p[0] || '', name:p[1] || '', phone:p[2] || '', cls };
  });
}
function showAdded(r) {

  dialog(`
    <h3>${esc(r.message)}</h3>
    ${r.added.length ? `<p class="note">رمزها را بعداً هم در فهرست (دکمه‌ی «نمایش رمزها») می‌بینید.</p>

    <div class="dlg-actions">${r.added.length ? '<button class="btn primary" id="dPrint">چاپ</button><button class="btn" id="dCopy">کپی</button>' : ''}<button class="btn" data-close>بستن</button></div>`, d => {

function wireUserActions(el, role, list) {
  el.onclick = async e => {
    const b = e.target.closest('button[data-a]'); if (!b) return;
    const u = list()[+b.dataset.i]; if (!u) return;
    if (b.dataset.a === 'imp') return impEnter(role, u, b);
    if (b.dataset.a === 'edit') return editDlg(role, u);
    if (b.dataset.a === 'reset') return resetDlg(role, u);
    if (b.dataset.a === 'del') {
      let purge = false;
      if (role === 'student') {
        const pr = await new Promise(res => { let v = null; dialog(`<div class="ask"><p>«${esc(u.name)}» حذف شود؟</p><label class="small" style="display:block;margin-top:8px"><input type="checkbox" id="dPurge"> همه‌ی سوابق او هم پاک شود (حضور و غیاب، نمرات، انضباطی، آزمون‌های آزمایشی، کارنامه‌های بارگذاری‌شده و اطلاعات مشاوره)</label></div>
          <div class="dlg-actions"><button class="btn dangerfill" id="dOk">حذف</button><button class="btn" data-close>انصراف</button></div>`, d => { $('#dOk', d).onclick = () => { v = { purge:$('#dPurge', d).checked }; d.close(); }; d.addEventListener('close', () => res(v), { once:true }); }); });
        if (!pr) return; purge = pr.purge;
      } else if (!(await askConfirm(`«${u.name}» حذف شود؟`, 'حذف', true))) return;
      try { await mCall('userDel', { role, code:u.code, purge }, b); } catch (err) { fail(err); }
    }
  };
}
const userActs = (i, canDel, imp) => `<td class="act">${imp ? `<button class="btn sm primary" data-a="imp" data-i="${i}">ورود به پنل</button> ` : ''}<button class="btn sm" data-a="edit" data-i="${i}">ویرایش</button> <button class="btn sm" data-a="reset" data-i="${i}">تغییر رمز</button>${canDel ? ` <button class="btn sm danger" data-a="del" data-i="${i}">حذف</button>` : ''}</td>`;
const pwCell = (role, code) => !PWON[role] ? '' : `<td data-l="رمز">${PW[role][code] ? `<bdi class="code"><b>${esc(PW[role][code])}</b></bdi>` : '<span class="muted small">نامشخص؛ «تغییر رمز» بزنید</span>'}</td>`;
async function togglePw(role, codes, redraw, btn) {
  if (PWON[role]) { PWON[role] = false; return redraw(); }
  try {
    const r = await api('userPasses', { role, codes }, btn);
    r.list.forEach(x => PW[role][x.code] = x.pass);
    PWON[role] = true; redraw();
  } catch (e) { fail(e); }
}

      <label class="f">تلفن<input name="phone" inputmode="tel"></label>

    <div id="tList"></div>`;
  const draw = () => {
    $('#tPw').textContent = PWON.teacher ? 'پنهان کردن رمزها' : 'نمایش رمزها';
    $('#tList').innerHTML = M.teachers.length ? `<div class="scroll"><table class="tbl stack"><thead><tr><th>کد پرسنلی</th><th>نام</th><th>تلفن</th>${PWON.teacher ? '<th>رمز</th>' : ''}<th>ابلاغ</th><th></th></tr></thead><tbody>
      ${M.teachers.map((t, i) => `<tr><td data-l="کد پرسنلی"><bdi class="code">${esc(t.code)}</bdi></td><td data-l="نام"><b>${esc(t.name)}</b></td><td data-l="تلفن"><bdi class="code">${esc(t.phone) || '—'}</bdi></td>${pwCell('teacher', t.code)}<td data-l="ابلاغ"><button class="btn sm" type="button" data-bal="${esc(t.code)}">ابلاغ <span class="muted">(${nf(M.schedule.filter(s => s.teacher === t.code).reduce((a, s) => a + (s.week === 'همه' ? 2 : 1), 0))} ساعت)</span></button></td>${userActs(i, true, true)}</tr>`).join('')}
    </tbody></table></div>` : '<div class="empty">هنوز دبیری ثبت نشده است.</div>';
  };
  const balData = code => {                        // هر درس: کلاس، زنگ‌های هر روز و جمع زنگ هفتگی
    const days = M.days || ['شنبه', 'یکشنبه', 'دوشنبه', 'سه‌شنبه', 'چهارشنبه', 'پنجشنبه'], m = {}, order = [];
    M.schedule.filter(s => s.teacher === code).forEach(s => {
      const k = s.cls + '|' + s.course; if (!m[k]) { m[k] = { cls:s.cls, course:s.course, d:{}, n:0 }; order.push(k); }
      const hr = s.week === 'همه' ? 2 : 1;                            // هر زنگ = ۲ ساعت؛ زنگ هفته‌ی فرد/زوج نصف حساب می‌شود
      m[k].d[s.day] = (m[k].d[s.day] || 0) + hr; m[k].n += hr;
    });
    const rows = order.map(k => m[k]).sort((a, b) => byFa(a.cls, b.cls) || byFa(a.course, b.course));
    return { days, rows, total:rows.reduce((a, r) => a + r.n, 0) };
  };
  $('#tList').addEventListener('click', e => {
    const b = e.target.closest('[data-bal]'); if (!b) return;
    const t = M.teachers.find(x => x.code === b.dataset.bal), B = balData(t.code), head = ['کلاس', 'درس'].concat(B.days, ['جمع ساعت هفتگی']);
    const cells = r => [r.cls, r.course].concat(B.days.map(d => r.d[d] ? nf(r.d[d]) : ''), [nf(r.n)]);
    dialog(`<h3>ابلاغ ${esc(t.name)}</h3>${B.rows.length ? `<div class="scroll"><table class="tbl"><thead><tr>${head.map(x => `<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>
      ${B.rows.map(r => `<tr>${cells(r).map((c, i) => `<td class="${i > 1 ? 'num' : ''}">${esc(c) || '—'}</td>`).join('')}</tr>`).join('')}</tbody><tfoot><tr><th colspan="${head.length - 1}">جمع کل ساعت هفتگی (ابلاغ)</th><th class="num">${nf(B.total)}</th></tr></tfoot></table></div>
      <p class="muted small">عددها ساعت تدریس در هر روز است (هر زنگ = ۲ ساعت). زنگ‌های «فرد/زوج» یک هفته در میان برگزار می‌شود و یک ساعت حساب می‌شود.</p>` : '<div class="empty">برای این دبیر درسی در برنامه‌ی هفتگی ثبت نشده است.</div>'}
      <div class="dlg-actions"><button class="btn" data-close type="button">بستن</button>${B.rows.length ? '<button class="btn primary" id="balP" type="button">چاپ</button>' : ''}</div>`, d => {
      const p = $('#balP', d); if (p) p.onclick = () => printTable('ابلاغ ' + t.name, head, B.rows.map(cells), 'جمع کل ساعت هفتگی: ' + nf(B.total));
    });
  });
  wireUserActions($('#tList'), 'teacher', () => M.teachers);
  $('#tDef').onclick = async e => {
    if (!(await askConfirm('رمز همه‌ی دبیران به ۱۲۳۴۵۶ برمی‌گردد و هر دبیر در ورود بعدی باید رمز تازه بگذارد. ادامه می‌دهید؟', 'بازگردانی', true))) return;
    try { await mCall('userResetAll', { role:'teacher' }, e.target); toast(M.message); } catch (err) { fail(err); }
  };
  $('#tPw').onclick = e => togglePw('teacher', M.teachers.map(t => t.code), draw, e.target);
  $('#tf').onsubmit = async e => {
    e.preventDefault(); const f = e.target.elements;
    try { await mCall('userAdd', { role:'teacher', list:[{ code:f.code.value, name:f.name.value, phone:f.phone.value, pass:f.pass.value }] }, $('#tf button')); } catch (err) { fail(err); }
  };
  $('#tbGo').onclick = async e => {
    const list = parseBulk($('#tbTxt').value, '');
    if (!list.length) return toast('فهرست خالی است.');
    try { await mCall('userAdd', { role:'teacher', list }, e.target); } catch (err) { fail(err); }
  };
  draw();
}

/* --- برنامه هفتگی و تخصیص درس (با تک زنگ) — زیرمجموعه‌ی تنظیمات --- */
function mSchedule(el) {
  if (!M.classes.length) { el.innerHTML = '<div class="empty">ابتدا در «تنظیمات ← کلاس‌ها» کلاس تعریف کنید.<div><button class="btn sm primary" type="button" data-go="cls">تعریف کلاس</button></div></div>'; return; }
  if (!M.teachers.length) { el.innerHTML = '<div class="empty">ابتدا در زبانه‌ی «دبیران» دبیر اضافه کنید.<div><button class="btn sm primary" type="button" data-go="tch">افزودن دبیر</button></div></div>'; return; }
  if (!MT.schCls || !classOf(MT.schCls)) MT.schCls = M.classes[0].name;
  const cls = classOf(MT.schCls), st = M.settings;
  const mine = M.schedule.filter(s => norm(s.cls) === norm(cls.name));
  const get = (day, p, w) => mine.find(s => s.day === day && s.period === p && s.week === w) || {};
  const split = (day, p) => mine.some(s => s.day === day && s.period === p && s.week !== 'همه');
  const allCourses = uniq(curCourses(cls.grade, cls.major, true).map(x => x[2]).concat(M.schedule.map(s => s.course))).sort(byFa);
  const tOpts = sel => '<option value="">— دبیر —</option>' + M.teachers.slice().sort((a, b) => byFa(a.name, b.name))
    .map(t => `<option value="${esc(t.code)}" ${t.code === sel ? 'selected' : ''}>${esc(t.name)}</option>`).join('');
  const periods = Array.from({ length:st.periods }, (_, i) => i + 1);
  const line = (day, p, w, show) => { const s = get(day, p, w); return `<div class="line${w !== 'همه' ? ' alt' : ''}" data-w="${w}"${show ? '' : ' hidden'}>
    ${w !== 'همه' ? `<span class="wk">هفته‌ی ${w}</span>` : ''}<input list="courseList" placeholder="درس" value="${esc(s.course || '')}" aria-label="${esc(day)} زنگ ${p} ${w !== 'همه' ? 'هفته‌ی ' + w : ''} درس">
    <select aria-label="${esc(day)} زنگ ${p} ${w !== 'همه' ? 'هفته‌ی ' + w : ''} دبیر">${tOpts(s.teacher || '')}</select></div>`; };
  // تخصیص‌ها: هر «درس» این کلاس به کدام دبیر؛ تک زنگ نیم زنگ در هفته حساب می‌شود
  const asg = {};
  mine.forEach(s => { const k = s.course + '|' + s.teacher; asg[k] = asg[k] || { course:s.course, teacher:s.teacher, n:0 }; asg[k].n += s.week === 'همه' ? 1 : 0.5; });
  el.innerHTML = `
    <div class="row">
      <label class="f">کلاس<select id="schSel">${classOpts(cls.name)}</select></label>
      <div class="muted small" style="flex:2 1 300px">پایه <b>${esc(cls.grade)}</b>${cls.major ? ' · رشته <b>' + esc(cls.major) + '</b>' : ''} · شیفت <b>${esc(cls.shift)}</b> <button class="btn sm" type="button" id="toCls">تغییر</button><br>
        این هفته: <b>هفته‌ی ${esc(M.parity)}</b>. برای هر زنگ درس و دبیر را تعیین کنید؛ دبیر فقط به همین کلاس و درس دسترسی پیدا می‌کند.</div>
    </div>
    <p class="note">«تک زنگ»: اگر درسی ۳ ساعتی است، یک زنگ کامل را هر هفته به آن بدهید و در زنگ دیگر «تک زنگ» را بزنید تا برای هفته‌ی فرد و هفته‌ی زوج دو درس جدا تعیین شود.</p>
    <datalist id="courseList">${allCourses.map(c => `<option value="${esc(c)}">`).join('')}</datalist>
    <div class="days" style="margin-top:12px">${M.days.map(day => `<div class="day"><h3>${esc(day)}</h3>
      ${periods.map(p => { const sp = split(day, p), tm = slotTime(st, cls.shift, 'همه', p); return `<div class="slot" data-day="${esc(day)}" data-p="${p}">
        <div class="slot-h"><b>زنگ ${p}</b>${tm ? `<span class="num">${tmHtml(tm)}</span>` : ''}<label class="tk"><input type="checkbox" class="split"${sp ? ' checked' : ''}> تک زنگ</label></div>
        ${line(day, p, 'همه', !sp)}${line(day, p, 'فرد', sp)}${line(day, p, 'زوج', sp)}</div>`; }).join('')}
    </div>`).join('')}</div>
    <div class="savebar" style="margin-bottom:0;border-radius:0;border-bottom:1px solid var(--line)"><span class="grow small muted">خانه‌ی خالی یعنی آن زنگ درسی ندارد.</span><button class="btn primary" id="schSave">ذخیره‌ی برنامه‌ی کلاس ${esc(cls.name)}</button></div>
    <h3 style="margin-top:26px">تخصیص درس‌های کلاس ${esc(cls.name)}</h3>
    ${Object.keys(asg).length ? `<div class="scroll"><table class="tbl stack"><thead><tr><th>درس</th><th>دبیر</th><th>زنگ در هفته</th></tr></thead><tbody>
      ${Object.keys(asg).map(k => asg[k]).sort((a, b) => byFa(a.course, b.course)).map(a => `<tr><td data-l="درس"><b>${esc(a.course)}</b></td><td data-l="دبیر">${esc(tName(a.teacher))}</td><td data-l="زنگ">${nf(a.n)}</td></tr>`).join('')}
    </tbody></table></div>` : '<div class="empty">هنوز برنامه‌ای برای این کلاس ذخیره نشده است.</div>'}`;
  $('#schSel').onchange = e => { MT.schCls = e.target.value; mSchedule(el); };
  $('#toCls').onclick = () => goTab('cls');
  el.onchange = e => {
    const t = e.target;
    if (t.matches('.split')) {                      // روشن/خاموش کردن تک زنگ
      const slot = t.closest('.slot'), L = w => $(`.line[data-w="${w}"]`, slot);
      const val = l => [$('input', l).value, $('select', l).value], put = (l, v) => { $('input', l).value = v[0]; $('select', l).value = v[1]; };
      if (t.checked) { if (!val(L('فرد'))[0] && !val(L('فرد'))[1]) put(L('فرد'), val(L('همه'))); }
      else if (!val(L('همه'))[0] && !val(L('همه'))[1]) put(L('همه'), val(L('فرد')));
      L('همه').hidden = t.checked; L('فرد').hidden = !t.checked; L('زوج').hidden = !t.checked;
      return;
    }
    if (!t.matches('.line input')) return;          // درسی که قبلاً با دبیر مشخص آمده، دبیرش خودکار پر می‌شود
    const sel = t.nextElementSibling, c = norm(t.value);
    if (sel.value || !c) return;
    const prev = $$('.line', el).map(l => [norm($('input', l).value), $('select', l).value]).find(([cc, tt]) => cc === c && tt);
    if (prev) sel.value = prev[1];
  };
  $('#schSave').onclick = async e => {
    const slots = [];
    $$('.slot', el).forEach(s => {
      const sp = $('.split', s).checked;
      (sp ? ['فرد', 'زوج'] : ['همه']).forEach(w => {
        const l = $(`.line[data-w="${w}"]`, s), course = $('input', l).value.trim(), teacher = $('select', l).value;
        if (course || teacher) slots.push({ day:s.dataset.day, period:+s.dataset.p, week:w, course, teacher });
      });
    });
    try { await mCall('schSave', { cls:cls.name, slots }, e.target); } catch (err) { fail(err); }
  };
}

/* --- ضرایب دروس --- */
function mCoef(el) {                               // تعریف دروس: افزودن، حذف، ویرایش و افزودن گروهی دروس هر پایه و رشته با ضریب و کد
  const key = (g, m, c) => norm(g) + '|' + norm(m) + '|' + norm(c), gk = (g, m) => norm(g) + '|' + norm(m);
  const saved = {}; M.coefs.forEach(x => saved[gk(x.grade, x.major)] = true);
  const rows = [], have = {};
  const add = (g, m, c, code, coef, units) => { const k = key(g, m, c); if (have[k]) return; have[k] = 1; rows.push({ grade:g, major:m, course:c, code:code || '', coef:coef == null ? '' : coef, units:units == null ? null : units }); };
  M.coefs.forEach(x => add(x.grade, x.major, x.course, x.code, x.coef));
  // گروه‌هایی که هنوز ذخیره نشده‌اند: دروس برنامه‌ی درسی و برنامه‌ی هفتگی به‌عنوان پیش‌فرض می‌آیند
  M.classes.forEach(c => { if (saved[gk(c.grade, c.major)]) return; curCourses(c.grade, c.major).forEach(x => add(c.grade, c.major, x[2], x[1], x[3], x[3])); });
  M.schedule.forEach(s => { const c = classOf(s.cls); if (c && !saved[gk(c.grade, c.major)]) add(c.grade, c.major, s.course, '', 1); });
  const extraG = [];                                // پایه/رشته‌ی تازه‌ای که هنوز درسی ندارد
  const groups = () => { const o = [], seen = {}; rows.concat(M.classes.map(c => ({ grade:c.grade, major:c.major })), extraG.map(g => ({ grade:g[0], major:g[1] }))).forEach(x => { const k = gk(x.grade, x.major); if (!seen[k]) { seen[k] = 1; o.push({ grade:x.grade, major:x.major, k }); } }); return o.sort((a, b) => byFa(a.grade, b.grade) || byFa(a.major, b.major)); };
  const inSch = (g, m, c) => M.schedule.some(s => { const k = classOf(s.cls); return k && gk(k.grade, k.major) === gk(g, m) && norm(s.course) === norm(c); });
  const draw = () => {
    const G = groups(), hasUnits = rows.some(x => x.units != null);
    el.innerHTML = `<h2>تعریف دروس</h2>
      <p class="muted small">دروس هر پایه و رشته را با کد و ضریب تعریف کنید؛ ضریب در معدل کارنامه و نمرات دانش‌آموز به کار می‌رود. می‌توانید درس اضافه، ویرایش یا حذف کنید یا چند درس را یک‌جا (گروهی) وارد کنید. تغییرات با «ذخیره‌ی دروس» ثبت می‌شود.</p>
      <div class="row" style="align-items:end;margin:8px 0"><label class="f"><span>پایه</span><input id="cdG" list="cdGl" placeholder="مثلاً دهم" autocomplete="off"></label><label class="f"><span>رشته</span><input id="cdM" list="cdMl" placeholder="مثلاً ریاضی و فیزیک" autocomplete="off"></label>
        <button class="btn" id="cdAddG" type="button" style="flex:0 0 auto">افزودن پایه / رشته</button>${hasUnits ? '<button class="btn sm" type="button" id="cUnits" style="flex:0 0 auto">ضریب همه‌ی دروس = تعداد واحد</button>' : ''}</div>
      <datalist id="cdGl">${uniq(M.classes.map(c => c.grade).filter(Boolean)).map(g => `<option value="${esc(g)}">`).join('')}</datalist><datalist id="cdMl">${uniq(M.classes.map(c => c.major).filter(Boolean)).map(g => `<option value="${esc(g)}">`).join('')}</datalist>
      ${G.length ? G.map(g => { const list = rows.map((x, i) => [x, i]).filter(([x]) => gk(x.grade, x.major) === g.k);
        return `<div class="cdG" data-g="${esc(g.k)}"><div class="row" style="align-items:center;margin-top:16px"><h3 style="flex:1 1 auto">${esc(g.grade || 'بدون پایه')} · ${esc(g.major || 'بدون رشته')} <span class="muted small">(${nf(list.length)} درس)</span></h3>
          <button class="btn sm" type="button" data-add="${esc(g.k)}">+ درس</button><button class="btn sm" type="button" data-bulk="${esc(g.k)}">افزودن گروهی</button></div>
          ${list.length ? `<div class="scroll"><table class="tbl"><thead><tr><th style="width:110px">کد درس</th><th>نام درس</th><th style="width:110px">ضریب</th><th style="width:60px"></th></tr></thead><tbody>
          ${list.map(([x, i]) => `<tr><td><input class="cdc" data-i="${i}" data-f="code" value="${esc(x.code)}" inputmode="numeric" style="max-width:100px"></td><td><input class="cdc" data-i="${i}" data-f="course" value="${esc(x.course)}" maxlength="50" placeholder="نام درس"></td>
            <td><input class="cdc" data-i="${i}" data-f="coef" value="${esc(x.coef === '' ? '' : nf(x.coef))}" inputmode="decimal" placeholder="۱" style="max-width:90px;text-align:center"></td><td><button class="btn sm danger" type="button" data-del="${i}" title="حذف درس">✕</button></td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">هنوز درسی تعریف نشده؛ «+ درس» یا «افزودن گروهی» را بزنید.</div>'}</div>`; }).join('')
        + `<div class="savebar" style="margin-top:14px"><span class="grow small muted">پایه/رشته‌هایی که درسی ندارند ذخیره نمی‌شوند.</span><button class="btn primary" id="cSave" type="button">ذخیره‌ی دروس</button></div>`
        : '<div class="empty">هنوز کلاس یا درسی ثبت نشده است؛ بالا پایه و رشته را بنویسید و «افزودن پایه / رشته» را بزنید.</div>'}`;
  };
  const gOf = k => groups().find(g => g.k === k);
  el.oninput = e => { const t = e.target.closest('.cdc'); if (!t) return; rows[+t.dataset.i][t.dataset.f] = t.value; };
  el.onclick = async e => {
    const q = s => e.target.closest(s);
    if (q('#cdAddG')) { const g = $('#cdG', el).value.trim(), m = $('#cdM', el).value.trim(); if (!g) return toast('پایه را بنویسید.'); if (!groups().some(x => x.k === gk(g, m))) extraG.push([g, m]); draw(); return; }
    if (q('#cUnits')) { rows.forEach(x => { if (x.units != null) x.coef = x.units; }); draw(); return toast('ضریب دروس برنامه‌ی درسی برابر تعداد واحد شد. برای ثبت، «ذخیره‌ی دروس» را بزنید.'); }
    const a = q('[data-add]'); if (a) { const g = gOf(a.dataset.add); rows.push({ grade:g.grade, major:g.major, course:'', code:'', coef:'', units:null }); draw(); const last = $$(`[data-g="${CSS.escape(g.k)}"] .cdc[data-f="course"]`, el).pop(); if (last) last.focus(); return; }
    const d = q('[data-del]'); if (d) {
      const x = rows[+d.dataset.del];
      if (inSch(x.grade, x.major, x.course) && !(await askConfirm(`درس «${x.course}» در برنامه‌ی هفتگی استفاده شده است. با حذف آن ضریب این درس ۱ حساب می‌شود. حذف شود؟`, 'حذف', true))) return;
      rows.splice(+d.dataset.del, 1); draw(); return;
    }
    const b = q('[data-bulk]'); if (b) {
      const g = gOf(b.dataset.bulk);

      <div style="background:var(--line);border-radius:8px;height:12px;margin:10px 0"><div style="width:${pct}%;height:100%;border-radius:8px;background:linear-gradient(90deg,#34d399,#059669)"></div></div>

        <div style="text-align:center;font-size:44px;font-weight:700;margin:8px 0" id="plT" aria-live="off">${run ? '' : '۰۰:۰۰'}</div>
        <div class="savebar"><button class="btn" id="plSetG" type="button">ثبت هدف</button><span class="grow"></span><button class="btn primary" id="plGo" type="button">${run ? 'توقف' : 'شروع'}</button></div></div>

      ${Object.keys(t.by).length ? `<h3 style="margin-top:12px">امروز به تفکیک درس</h3><table class="tbl"><tbody>${Object.keys(t.by).map(k => `<tr><td>${esc(k)}</td><td class="num">${nf(t.by[k])} دقیقه</td></tr>`).join('')}</tbody></table>` : ''}`;

/* ---------- کش بین درخواست‌ها (سرعت) ----------
   داده‌ی برگه‌های کوچک چند دقیقه در CacheService می‌ماند؛ هر نوشتن «نسخه»ی کش را عوض می‌کند و کش قبلی بی‌اثر می‌شود.
   برگه‌های بزرگ (مثل حضور و غیاب) اگر در کش جا نشوند همان‌طور مستقیم خوانده می‌شوند. ویرایش دستی در خود Google Sheet تا ۵ دقیقه دیرتر دیده می‌شود. */
const CACHE_TTL = 300, CACHE_CHUNK = 40000, CACHE_MAX_CHUNKS = 12;
function cacheVer_(k) {
  const c = CacheService.getScriptCache();
  let v = c.get('v|' + k);
  if (!v) { v = String(Date.now()); c.put('v|' + k, v, 21600); }
  return v;
}
function forget_(k) {                       // بعد از هر نوشتن روی برگه
  delete MEMO[k];
  try { CacheService.getScriptCache().put('v|' + k, String(Date.now()) + Math.random().toString(36).slice(2, 6), 21600); } catch (e) {}
}
function cachedRows_(k) {
  let c = null, base = '';
  try {
    c = CacheService.getScriptCache(); base = 'r|' + k + '|' + cacheVer_(k);
    const hd = String(c.get(base + '|n') || ''), z = hd.charAt(0) === 'z', n = Number(z ? hd.slice(1) : hd) || 0;
    if (n > 0) {
      const keys = []; for (let i = 0; i < n; i++) keys.push(base + '|' + i);
      const got = c.getAll(keys);
      if (keys.every(x => got[x] != null)) {
        const s = keys.map(x => got[x]).join('');
        return JSON.parse(z ? Utilities.ungzip(Utilities.newBlob(Utilities.base64Decode(s), 'application/x-gzip', 'r.gz')).getDataAsString() : s);
      }
    }
  } catch (e) { c = null; }
  const rows = sheet_(k).getDataRange().getValues().slice(1);
  if (c) {
    try {
      let s = JSON.stringify(rows), z = false;
      if (s.length > CACHE_CHUNK * 3) {            // برگه‌های بزرگ (حضور و غیاب، نمرات) فشرده می‌شوند تا در کش جا شوند
        s = Utilities.base64Encode(Utilities.gzip(Utilities.newBlob(s, 'application/octet-stream', 'r.json')).getBytes()); z = true;
      }
      const n = Math.ceil(s.length / CACHE_CHUNK);
      if (n > 0 && n <= CACHE_MAX_CHUNKS) {
        const o = {}; for (let i = 0; i < n; i++) o[base + '|' + i] = s.slice(i * CACHE_CHUNK, (i + 1) * CACHE_CHUNK);
        o[base + '|n'] = (z ? 'z' : '') + String(n);
        c.putAll(o, CACHE_TTL);

function rows_(k) {
  if (!MEMO[k]) MEMO[k] = cachedRows_(k);

function append_(k, rows) {
  if (!rows.length) return;
  const sh = sheet_(k), start = sh.getLastRow() + 1, need = start + rows.length - 1;
  if (sh.getMaxRows() < need) sh.insertRowsAfter(sh.getMaxRows(), need - sh.getMaxRows());   // جای خالی کافی
  sh.getRange(start, 1, rows.length, rows[0].length).setValues(rows);
  forget_(k);
}
function deleteWhere_(k, fn) {               // ردیف‌ها از پایین به بالا و دسته‌ای حذف می‌شوند
  const sh = sheet_(k), v = sh.getDataRange().getValues();
  let i = v.length - 1;
  while (i >= 1) {
    if (!fn(v[i])) { i--; continue; }
    let j = i;
    while (j - 1 >= 1 && fn(v[j - 1])) j--;
    const n = i - j + 1;
    if (sh.getMaxRows() - n < 2) sh.insertRowsAfter(sh.getMaxRows(), 1);   // شیت نمی‌تواند همه‌ی ردیف‌های غیرثابتش را از دست بدهد
    sh.deleteRows(j + 1, n);
    i = j - 1;
  }
  forget_(k);
}
function updateRow_(k, row, values) { sheet_(k).getRange(row, 1, 1, values.length).setValues([values]); forget_(k); }

const fa2en_ = s => String(s == null ? '' : s).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));

/* ---------- تاریخ شمسی ---------- */
function g2j_(gy, gm, gd) {                  // میلادی ← شمسی
  const gdm = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
  const gy2 = gm > 2 ? gy + 1 : gy;
  let days = 355666 + 365 * gy + Math.floor((gy2 + 3) / 4) - Math.floor((gy2 + 99) / 100) + Math.floor((gy2 + 399) / 400) + gd + gdm[gm - 1];
  let jy = -1595 + 33 * Math.floor(days / 12053); days %= 12053;
  jy += 4 * Math.floor(days / 1461); days %= 1461;
  if (days > 365) { jy += Math.floor((days - 1) / 365); days = (days - 1) % 365; }
  const jm = days < 186 ? 1 + Math.floor(days / 31) : 7 + Math.floor((days - 186) / 30);
  const jd = 1 + (days < 186 ? days % 31 : (days - 186) % 30);
  return [jy, jm, jd];
}
function j2g_(jy, jm, jd) {                  // شمسی ← میلادی
  jy += 1595;

  const ml = [0, 31, (gy % 4 === 0 && gy % 100 !== 0) || gy % 400 === 0 ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  for (gm = 0; gm < 13 && gd > ml[gm]; gm++) gd -= ml[gm];

}
const pad2_ = n => ('0' + n).slice(-2);
function todayJ_() {
  const n = new Date(), f = x => Number(Utilities.formatDate(n, TZ, x)), j = g2j_(f('yyyy'), f('M'), f('d'));
  return j[0] + '/' + pad2_(j[1]) + '/' + pad2_(j[2]);
}
const nowHM_ = () => Utilities.formatDate(new Date(), TZ, 'HH:mm');
const stamp_ = () => todayJ_() + ' ' + nowHM_();
function normDate_(s) {
  const m = /^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/.exec(fa2en_(s).trim());
  return m ? m[1] + '/' + pad2_(m[2]) + '/' + pad2_(m[3]) : '';
}
function dateFmtOk_(d) {
  if (!d) return false;
  const [y, m, day] = d.split('/').map(Number);
  return y >= 1390 && y <= 1500 && m >= 1 && m <= 12 && day >= 1 && day <= (m <= 6 ? 31 : 30);
}
const dateOk_ = d => dateFmtOk_(d) && d <= todayJ_();          // تاریخ آینده پذیرفته نمی‌شود
function jToUtc_(d) { const [y, m, dd] = d.split('/').map(Number), g = j2g_(y, m, dd); return Date.UTC(g[0], g[1] - 1, g[2]); }
function utcToJ_(t) { const x = new Date(t), j = g2j_(x.getUTCFullYear(), x.getUTCMonth() + 1, x.getUTCDate()); return j[0] + '/' + pad2_(j[1]) + '/' + pad2_(j[2]); }
const dayIdx_ = d => (new Date(jToUtc_(d)).getUTCDay() + 1) % 7;   // ۰ = شنبه … ۶ = جمعه
function parity_(d) {                       // هفته‌ی فرد یا زوج؛ هفته‌ای که تاریخ مبنا در آن است «فرد» حساب می‌شود
  const ref = settings_().weekRef, start = jToUtc_(ref) - dayIdx_(ref) * 864e5;
  const w = Math.floor((jToUtc_(d) - start) / (7 * 864e5));

}
const active_ = (week, par) => week === 'همه' || week === par;
function shiftAt_(shift, par) {             // شیفت کلاس در هفته‌ی فرد یا زوج ← am / pm
  const s = String(shift || '');
  if (s.indexOf('فرد صبح') >= 0) return par === 'فرد' ? 'am' : 'pm';
  if (s.indexOf('فرد عصر') >= 0) return par === 'فرد' ? 'pm' : 'am';

}
function range_(p, maxDays) {

  if (from > to) return { err:'تاریخ شروع بعد از تاریخ پایان است.' };
  if ((jToUtc_(to) - jToUtc_(from)) / 864e5 > maxDays) return { err:'بازه حداکثر ' + maxDays + ' روز می‌تواند باشد.' };

}
function num_(v) {                          // «۱۷٫۵» و «17/5» هم پذیرفته می‌شود

/* ---------- تنظیمات (نام مدرسه، ساعت زنگ‌ها، هفته‌ی فرد/زوج، نوبت‌ها) ---------- */

/* ---------- رمز و نشست ---------- */
function secret_() {
  const pr = PropertiesService.getScriptProperties();
  let s = pr.getProperty('SECRET');
  if (!s) { s = Utilities.getUuid() + Utilities.getUuid(); pr.setProperty('SECRET', s); }
  return s;
}
const b64_  = bytes => Utilities.base64EncodeWebSafe(bytes);
const hash_ = (role, code, pass) => b64_(Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, 'school-raw|' + role + '|' + code + '|' + pass, Utilities.Charset.UTF_8));
const sign_ = s => b64_(Utilities.computeHmacSha256Signature(s, secret_(), Utilities.Charset.UTF_8));

const mustChange_ = u => !!u && u.hash === hash_(u.role, u.code, DEFAULT_PASS);
// کد ملی: ۱۰ رقم (اگر اکسل صفر اول را انداخته باشد، تکمیل می‌شود)
function natCode_(s) { let c = code_(s); if (/^\d{8,9}$/.test(c)) c = ('0000000000' + c).slice(-10); return c; }
// نسخه‌ی رمزنگاری‌شده‌ی رمز، تا مدیر بتواند آن را ببیند (در شیت خوانا نیست)
function keystream_(nonce, n) {
  const out = [];
  for (let c = 0; out.length < n; c++) Utilities.computeHmacSha256Signature(nonce + '|' + c, secret_(), Utilities.Charset.UTF_8).forEach(b => out.push(b));

}

  return nonce + ':' + b64_(bytes.map((b, i) => b ^ ks[i]));
}

    const bytes = Utilities.base64DecodeWebSafe(p[1]), ks = keystream_(p[0], bytes.length);
    return Utilities.newBlob(bytes.map((b, i) => b ^ ks[i])).getDataAsString();
  } catch (e) { return ''; }
}

function issue_(u) {                        // نشست امضاشده؛ با تغییر رمز، نشست‌های قبلی باطل می‌شوند
  const t = { r:u.role, c:u.code, e:Date.now() + SESSION_DAYS * 864e5, h:String(u.hash).slice(0, 12) };
  t.s = sign_(JSON.stringify([t.r, t.c, t.e, t.h]));
  return t;
}
const IMP_HOURS = 3;
function issueImp_(mgr, u) {                 // نشست کوتاه‌مدت «مشاهده‌ی پنل» توسط مدیر
  const t = { r:u.role, c:u.code, e:Date.now() + IMP_HOURS * 36e5, h:String(u.hash).slice(0, 12), i:mgr.code, m:String(mgr.hash).slice(0, 12) };
  t.s = sign_(JSON.stringify([t.r, t.c, t.e, t.h, t.i, t.m]));
  return t;
}
function impStart_(u, p) {

  const t = findUser_(role, p.code);

}

    const m = findUser_('manager', t.i), x = findUser_(t.r, t.c);
    if (!m || String(m.hash).slice(0, 12) !== t.m || !x || String(x.hash).slice(0, 12) !== t.h || ['student', 'teacher', 'counselor'].indexOf(t.r) < 0) return null;

/* ---------- کاربران ---------- */
const ROLE = {
  student:{ k:'stu', label:'دانش‌آموز' },
  teacher:{ k:'tch', label:'دبیر' },
  counselor:{ k:'cnl', label:'مشاور' },
  manager:{ k:'mgr', label:'مدیر' }
};
function userOf_(role, r, row) {
  const s = i => str_(r[i]);
  if (role === 'student') return { role, row, code:code_(r[0]), name:s(1), cls:s(2), phone:s(3), hash:s(4), enc:s(5), status:s(6) === 'انتقالی' ? 'انتقالی' : 'فعال' };

}
function usersAll_(role) {                        // همه‌ی کاربران، حتی دانش‌آموزان انتقالی (فقط برای مدیریت)
  return rows_(ROLE[role].k).map((r, i) => userOf_(role, r, i + 2)).filter(u => u.code);
}
function users_(role) {                           // دانش‌آموز انتقالی از همه‌ی فهرست‌ها و گزارش‌ها حذف می‌شود
  const a = usersAll_(role);
  return role === 'student' ? a.filter(u => u.status !== 'انتقالی') : a;
}
function findUser_(role, code, all) {

  return c ? (all ? usersAll_(role) : users_(role)).find(u => u.code === c) || null : null;
}
function stuCols_() {                             // ستون «وضعیت» برای برگه‌های قدیمی (یک بار)
  if (MEMO.stuCols) return; MEMO.stuCols = 1;
  const sh = sheet_('stu');
  if (sh.getMaxColumns() < 7) sh.insertColumnsAfter(sh.getMaxColumns(), 7 - sh.getMaxColumns());
  if (!str_(sh.getRange(1, 7).getValue())) sh.getRange(1, 7).setValue(HEADS.stu[6]).setFontWeight('bold');
}
function userRow_(u) {
  if (u.role === 'student') { stuCols_(); return [u.code, u.name, u.cls, u.phone, u.hash, u.enc || '', u.status === 'انتقالی' ? 'انتقالی' : 'فعال']; }
  if (u.role === 'teacher' || u.role === 'counselor') return [u.code, u.name, u.phone, u.hash, u.enc || ''];
  return [u.code, u.name, u.hash, u.enc || ''];
}
function setPass_(u, pass) { u.hash = hash_(u.role, u.code, pass); u.enc = enc_(pass); updateRow_(ROLE[u.role].k, u.row, userRow_(u)); }

  if (u.imp) o.imp = u.imp;
  if (u.role === 'student') { const c = classOf_(u.cls); o.cls = u.cls; o.grade = c ? c.grade : ''; o.major = c ? c.major : ''; }
  return o;
}

function login_(p) {
  const role = String(p.role || ''), code = code_(p.code), pass = fa2en_(p.pass).trim();
  if (!ROLE[role]) return err_('نوع ورود نامعتبر است.');
  if (!code || !pass) return err_('نام کاربری/کد و رمز را وارد کنید.');
  const cache = CacheService.getScriptCache(), ck = 'fail|' + role + '|' + code;
  const fails = Number(cache.get(ck) || 0);
  if (fails >= 5) return err_('به‌دلیل چند تلاش ناموفق، ۱۰ دقیقه‌ی دیگر دوباره امتحان کنید.');
  const u = findUser_(role, code, true);
  if (!u || u.hash !== hash_(role, u.code, pass)) {
    cache.put(ck, String(fails + 1), 600);
    return err_(role === 'manager' ? 'نام کاربری یا رمز نادرست است.' : 'کد یا رمز نادرست است.');
  }
  cache.remove(ck);
  if (role === 'student' && u.status === 'انتقالی') return err_('وضعیت این دانش‌آموز «انتقالی» است و امکان ورود ندارد. با مدیر مدرسه تماس بگیرید.');
  if (!u.enc) { u.enc = enc_(pass); updateRow_(ROLE[role].k, u.row, userRow_(u)); }   // کاربران نسخه‌ی قبلی
  try { jexMigrate_(); } catch (x) {}
  try { grMigrate_(); } catch (x) {}

  algPurge_();
  return { status:'ok', token:issue_(u), user:publicUser_(u), school:settings_().school };
}
function myPass_(u, p) {                     // تغییر رمز توسط خود کاربر
  const old = fa2en_(p.old).trim(), np = fa2en_(p.pass).trim();
  if (u.hash !== hash_(u.role, u.code, old)) return err_('رمز فعلی نادرست است.');
  if (np.length < 4) return err_('رمز تازه باید دست‌کم ۴ کاراکتر باشد.');
  if (np === old) return err_('رمز تازه با رمز فعلی یکی است.');
  if (np === DEFAULT_PASS) return err_('رمز پیش‌فرض را نمی‌توان رمز تازه کرد؛ رمز دیگری انتخاب کنید.');
  setPass_(u, np);
  return { status:'ok', token:issue_(u), user:publicUser_(u), message:'رمز شما تغییر کرد.' };

/* ---------- کلاس‌ها، برنامه و ضرایب ---------- */
function classes_() {

    const sh = str_(r[3]);
    return { name:str_(r[0]), grade:str_(r[1]), major:str_(r[2]), shift:SHIFTS.indexOf(sh) >= 0 ? sh : 'صبح' };
  });
}
function classOf_(name) { const n = norm_(name); return classes_().find(c => norm_(c.name) === n) || null; }
function schedule_() {
  return rows_('sch').filter(r => str_(r[0]) && str_(r[3])).map(r => {
    const w = str_(r[5]);
    return { cls:str_(r[0]), day:str_(r[1]), period:Number(r[2]), course:str_(r[3]), teacher:code_(r[4]), week:WEEKS.indexOf(w) >= 0 ? w : 'همه' };
  });
}
function assignments_(tcode) {              // ترکیب‌های یکتای «کلاس + درس» که در برنامه به این دبیر داده شده
  const m = {}, order = [];
  schedule_().filter(s => s.teacher === tcode).forEach(s => {
    const k = norm_(s.cls) + '|' + norm_(s.course);
    if (!m[k]) { m[k] = { cls:s.cls, course:s.course, slots:[] }; order.push(k); }
    m[k].slots.push({ day:s.day, period:s.period, week:s.week });

    const a = m[k], c = classOf_(a.cls);
    a.grade = c ? c.grade : ''; a.major = c ? c.major : ''; a.shift = c ? c.shift : 'صبح';
    a.slots.sort((x, y) => DAYS.indexOf(x.day) - DAYS.indexOf(y.day) || x.period - y.period);

}
function clsRoster_(u, p) {                       // مدیر: فهرست کلاس با همان ترتیب نمایش دانش‌آموزان در برنامه (چاپ)
  const c = classes_().find(x => norm_(x.name) === norm_(p.cls));

}
function rosterOf_(u, p) {                        // فهرست دانش‌آموزان کلاسِ اختصاص‌یافته به دبیر

}

  if (u.role !== 'teacher') return null;
  const s = schedule_().find(x => x.teacher === u.code && norm_(x.cls) === norm_(cls) && norm_(x.course) === norm_(course));
  return s ? { cls:s.cls, course:s.course } : null;
}

      if (h == null || h <= 0 || h > 10) return err_('میزان ساعت ' + kind + ' «' + t.name + '» را بنویسید (مثلاً ۰٫۵ یا ۱٫۵).');
      minutes = Math.round(h * 60);
    }
    add.push([Utilities.getUuid().replace(/-/g, '').slice(0, 10), date, t.key, t.name, 'دبیر', kind, minutes, '', '', clean_(m.note, 200), now, periods, '1']);
  }
  const keys = {}; list.forEach(t => keys[t.key] = true);
  deleteWhere_('stf', r => str_(r[1]) === date && (keys[str_(r[2])] || str_(r[2]) === 'o:none') && (str_(r[12]) === '1' || str_(r[9]) === STF_DAYTAG));   // فقط ثبت‌های همین فهرست جایگزین می‌شود
  if (add.length) append_('stf', add);
  else append_('stf', [[Utilities.getUuid().replace(/-/g, '').slice(0, 10), date, 'o:none', '—', '—', 'حاضر', '', '', '', '', now, '', '1']]);   // نشانه‌ی «این روز ثبت شد»
  return Object.assign(stfDay_(u, { date }), { message:add.length ? 'حضور و غیاب دبیران ذخیره شد.' : 'همه حاضر ثبت شد.' });
}
function stfParse_(p) {                           // اعتبارسنجی مشترک ثبت و ویرایش
  const date = normDate_(p.date), kind = str_(p.kind), st = stfStaff_().find(x => x.key === str_(p.key));
  if (!st) return { err:'فرد را از فهرست کارکنان انتخاب کنید. (نام‌ها از چارت مدرسه و دبیران می‌آید.)' };
  if (STF_KINDS.indexOf(kind) < 0) return { err:'نوع را انتخاب کنید.' };
  if (!dateFmtOk_(date)) return { err:'تاریخ نامعتبر است.' };
  let minutes = 0, days = 0, leave = '';
  if (kind === 'مرخصی') {
    leave = str_(p.leave);
    if (STF_LEAVES.indexOf(leave) < 0) return { err:'نوع مرخصی را انتخاب کنید.' };
    if (str_(p.unit) === 'hour') {                // مرخصی ساعتی: مدت به دقیقه ذخیره می‌شود و تعداد روز خالی می‌ماند
      const h = num_(p.hours);
      if (h == null || h <= 0 || h > 24) return { err:'مدت مرخصی ساعتی را به ساعت وارد کنید (مثلاً ۲ یا ۱٫۵).' };
      minutes = Math.round(h * 60);
    } else {
      days = num_(p.days);
      if (days == null || days <= 0 || days > 365) return { err:'تعداد روز مرخصی را وارد کنید (مثلاً ۱ یا ۰٫۵).' };
    }
  } else if (kind === 'غیبت') {
    days = num_(p.days);
    if (days == null || days <= 0 || days > 365) return { err:'تعداد روز غیبت را وارد کنید (مثلاً ۱ یا ۰٫۵).' };
  } else {
    minutes = num_(p.minutes);
    if (minutes == null || minutes <= 0 || minutes > 600 || Math.floor(minutes) !== minutes) return { err:'مدت را به دقیقه (عدد صحیح) وارد کنید.' };
  }
  return { st, date, kind, minutes, days, leave, note:clean_(p.note, 200) };
}
function stfAdd_(u, p) {
  const v = stfParse_(p);
  if (v.err) return err_(v.err);
  append_('stf', [[Utilities.getUuid().replace(/-/g, '').slice(0, 10), v.date, v.st.key, v.st.name, v.st.post, v.kind, v.minutes || '', v.days || '', v.leave, v.note, stamp_()]]);
  return stfData_({ message:'«' + v.kind + '» برای ' + v.st.name + ' ثبت شد.' });
}
function stfEdit_(u, p) {
  const id = str_(p.id), old = rows_('stf').find(r => str_(r[0]) === id);
  if (!old) return err_('مورد پیدا نشد (ممکن است حذف شده باشد).');
  const v = stfParse_(p);
  if (v.err) return err_(v.err);
  deleteWhere_('stf', r => str_(r[0]) === id);
  append_('stf', [[id, v.date, v.st.key, v.st.name, v.st.post, v.kind, v.minutes || '', v.days || '', v.leave, v.note, str_(old[10]) || stamp_()]]);
  return stfData_({ message:'مورد ویرایش شد.' });
}
function stfDel_(u, p) {
  const id = str_(p.id);
  if (!rows_('stf').some(r => str_(r[0]) === id)) return err_('مورد پیدا نشد.');

}

const BKP_FOLDER = 'پشتیبان مدرسه‌یار';              // پوشه‌ی آرشیو سال‌ها در Drive (فقط برای «ارتقای سال»)
const BKP_NEED = 'اجازه‌ی دسترسی به Google Drive داده نشده است. در ویرایشگر Apps Script تابع setup را یک‌بار Run کنید و اجازه‌ها را تأیید کنید.';
function bkpFolder_() {
  const it = DriveApp.getFoldersByName(BKP_FOLDER);
  return it.hasNext() ? it.next() : DriveApp.createFolder(BKP_FOLDER);
}
function backupWeekly() {                         // پشتیبان‌گیری حذف شد؛ این تابع فقط تریگرهای قدیمی را برمی‌دارد
  ScriptApp.getProjectTriggers().forEach(t => { if (t.getHandlerFunction() === 'backupWeekly') { try { ScriptApp.deleteTrigger(t); } catch (e) {} } });
}
const BIG_ROWS = 40000;                           // برگه‌ی حجیم
function sheetStats_() {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  return Object.keys(SH).map(k => {
    const sh = ss.getSheetByName(SH[k]); const n = sh ? Math.max(0, sh.getLastRow() - 1) : 0; let cells = 0, cols = 0;
    if (n > 0) {                                  // سلول‌های دارای داده (بدون سطر عنوان)
      cols = sh.getLastColumn();
      sh.getRange(2, 1, n, cols).getValues().forEach(r => r.forEach(v => { if (v !== '' && v != null) cells++; }));
    }
    return { key:k, name:SH[k], rows:n, cols, cells, big:n >= BIG_ROWS };
  }).filter(x => x.rows > 0).sort((a, b) => b.cells - a.cells);
}
function volInfo_(u, p) {                         // حجم و جزئیات داده‌های هر بخش
  const st = sheetStats_();
  return { status:'ok', stats:st, total:st.reduce((s, x) => s + x.rows, 0), cells:st.reduce((s, x) => s + x.cells, 0), bigLimit:BIG_ROWS };
}

// ارتقای سال: ۱) کپی کامل در Drive به‌عنوان آرشیو ۲) پاک‌کردن داده‌های سال ۳) جابه‌جایی کلاس‌ها / فارغ‌التحصیلی
const ROLL_CLEAR = ['ses', 'att', 'ant', 'gr', 'jex', 'jsc', 'jpc', 'tpf', 'tup', 'ins', 'abj', 'dsc', 'dap', 'exm', 'stf', 'gpc', 'fac', 'gal', 'fee', 'lrq', 'pta', 'ptr', 'pvr', 'sms'];
const ROLL_GRAD = '__grad';
function rollPreview_(u, p) {
  const ss = SpreadsheetApp.getActiveSpreadsheet(), counts = ROLL_CLEAR.map(k => { const sh = ss.getSheetByName(SH[k]); return { name:SH[k], rows:sh ? Math.max(0, sh.getLastRow() - 1) : 0 }; });
  const cnt = {}; users_('student').forEach(s => { const k = norm_(s.cls); cnt[k] = (cnt[k] || 0) + 1; });
  return { status:'ok', counts, classes:classes_().map(c => ({ name:c.name, grade:c.grade, major:c.major, students:cnt[norm_(c.name)] || 0 })), last:kvGet_('rollLast') };
}
function rollRun_(u, p) {
  if (str_(p.confirm) !== 'ارتقا') return err_('برای تأیید، کلمه‌ی «ارتقا» را بنویسید.');
  const map = p.map && typeof p.map === 'object' ? p.map : {}, plan = {};
  for (const c of classes_()) {
    const d = str_(map[c.name]);
    if (!d || norm_(d) === norm_(c.name)) { plan[norm_(c.name)] = c.name; continue; }
    if (d === ROLL_GRAD) { plan[norm_(c.name)] = ROLL_GRAD; continue; }
    const t = classOf_(d);
    if (!t) return err_('کلاس مقصد «' + d + '» پیدا نشد.');
    plan[norm_(c.name)] = t.name;
  }
  const t = todayJ_().split('/').map(Number), ay = t[1] >= 7 ? t[0] : t[0] - 1;
  let arch;
  try {                                           // بدون آرشیو موفق، هیچ داده‌ای پاک نمی‌شود
    arch = DriveApp.getFileById(SpreadsheetApp.getActiveSpreadsheet().getId()).makeCopy('آرشیو سال تحصیلی ' + ay + '-' + (ay + 1) + ' ' + stamp_().replace(/[\/:]/g, '-'), bkpFolder_());
  } catch (e) { return err_('ساخت آرشیو ناموفق بود و چیزی پاک نشد. ' + BKP_NEED + ' (' + (e && e.message ? e.message : e) + ')'); }
  ROLL_CLEAR.forEach(k => deleteWhere_(k, () => true));
  deleteWhere_('tfl', r => str_(r[0]).indexOf('brand_') !== 0);        // عکس کارنامه‌ها؛ لوگو و سربرگ می‌ماند
  const sh = sheet_('stu'), v = sh.getDataRange().getValues(), grads = {};
  let moved = 0, graduated = 0;
  for (let i = 1; i < v.length; i++) {
    const to = plan[norm_(v[i][2])];
    if (to === ROLL_GRAD) { grads[code_(v[i][0])] = true; graduated++; }
    else if (to && to !== str_(v[i][2])) { v[i][2] = to; moved++; }
  }
  if (v.length > 1) sh.getRange(2, 1, v.length - 1, v[0].length).setValues(v.slice(1));
  forget_('stu');
  if (graduated) {
    deleteWhere_('stu', r => grads[code_(r[0])]);
    deleteWhere_('csi', r => grads[code_(r[0])]);
    deleteWhere_('fcf', r => grads[code_(r[0])]);
    deleteWhere_('cns', r => grads[code_(r[2])]);
    deleteWhere_('pho', r => { const k = str_(r[0]).split('|'); return k[0] === 'student' && grads[k[1]]; });
  }
  setKV_({ rollLast:stamp_() + ' | ' + moved + ' ارتقا | ' + graduated + ' فارغ‌التحصیل' });
  return Object.assign(rollPreview_(u, p), { message:'انجام شد: ' + moved + ' دانش‌آموز ارتقا یافت، ' + graduated + ' نفر فارغ‌التحصیل شد. آرشیو سال در Drive (پوشه‌ی «' + BKP_FOLDER + '») با نام «' + arch.getName() + '» ذخیره شد.' });
}

const PHO_OK = /^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/, PHO_MAX = 45000;
function phoKey_(role, code) { return role + '|' + code_(code); }
function phoRow_(key) {                           // شماره‌ی ردیف عکس (۰ = ندارد)
  const sh = sheet_('pho'), n = sh.getLastRow() - 1;
  if (n < 1) return 0;
  const f = sh.getRange(2, 1, n, 1).createTextFinder(key).matchEntireCell(true).findNext();
  return f ? f.getRow() : 0;
}
function phoGet_(role, code) {
  try { const r = phoRow_(phoKey_(role, code)); return r ? String(sheet_('pho').getRange(r, 2).getValue() || '') : ''; } catch (e) { return ''; }
}
function phoPut_(role, code, img) {
  const key = phoKey_(role, code), r = phoRow_(key);
  if (r) { sheet_('pho').getRange(r, 2).setValue(img); forget_('pho'); } else append_('pho', [[key, img]]);
}
function phoRename_(role, from, to) {
  const r = phoRow_(phoKey_(role, from));
  if (r) { sheet_('pho').getRange(r, 1).setValue(phoKey_(role, to)); forget_('pho'); }
}
function phoTarget_(u, p) {                       // مدیر برای هر دانش‌آموز/دبیر؛ دبیر فقط برای خودش

  const role = str_(p.role), x = (role === 'student' || role === 'teacher') ? findUser_(role, p.code, true) : null;

}
function phoSave_(u, p) {

  if (!PHO_OK.test(img) || img.length > PHO_MAX) return err_('عکس نامعتبر یا حجیم است.');
  phoPut_(t.role, t.code, img);
  return { status:'ok', photo:img, message:'عکس «' + t.name + '» ذخیره شد.' };
}
function phoDel_(u, p) {
  const t = phoTarget_(u, p);

function bannerSave_(u, p) {

  if (until && !dateFmtOk_(until)) return err_('تاریخ پایان نامعتبر است.');

// باز کردن آدرس Web App: فایل HTML به نام index در همین پروژه نمایش داده می‌شود
/* ---------- نسخه‌ی آفلاین (ساخت از تنظیمات) ----------
   مدیر در «تنظیمات ← نسخه‌ی آفلاین» یک فایل HTML می‌گیرد که کل داده‌های شیت و همین کد سرور را داخل خودش دارد
   و بدون اینترنت، فقط‌خواندنی کار می‌کند. رمزها (هش و نسخه‌ی رمزنگاری‌شده) و کلیدهای تنظیمات به فایل نمی‌روند. */
function offClean_(k, row) {
  const cut = { stu:[4, 5], tch:[3, 4], mgr:[2, 3], cnl:[3, 4] }[k];
  const o = row.map(v => v instanceof Date ? v.toISOString() : v);
  if (cut) cut.forEach(i => { if (i < o.length) o[i] = ''; });
  if (k === 'set' && /key|token|secret|pass/i.test(str_(o[0]))) o[1] = '';
  if (k === 'stu' || k === 'tch') { /* رمزها همه‌جا خالی */ }
  return o;
}
function offCtx_(u) {                              // دامنه‌ی داده‌ی هر نقش در فایل آفلاین
  if (u.role === 'manager') return { all:true, u };
  const ctx = { u, mates:[], pseudo:{}, codes:{}, classes:{}, pairs:{} };
  if (u.role === 'student') {
    ctx.ck = clsKey_(u.cls);
    ctx.mates = users_('student').filter(s => clsKey_(s.cls) === ctx.ck).sort((a, b) => a.code < b.code ? -1 : a.code > b.code ? 1 : 0);
    ctx.mates.forEach((s, i) => { ctx.pseudo[s.code] = s.code === u.code ? s.code : 'p' + (i + 1); });   // هم‌کلاسی‌ها فقط برای محاسبه‌ی رتبه و بدون هویت
  } else if (u.role === 'teacher') {
    rows_('sch').forEach(r => { if (code_(r[4]) === u.code) { ctx.classes[clsKey_(r[0])] = 1; ctx.pairs[norm_(r[0]) + '|' + norm_(r[3])] = 1; } });
    users_('student').forEach(s => { if (ctx.classes[clsKey_(s.cls)]) ctx.codes[s.code] = 1; });
  }
  return ctx;
}
function offRow_(ctx, k, row) {                    // ردیف قابل‌نمایش برای این نقش یا null
  if (ctx.all) return row;
  const u = ctx.u, role = u.role, o = row.slice(), cd = i => code_(row[i]), pair = (i, j) => !!ctx.pairs[norm_(row[i]) + '|' + norm_(row[j])];
  const BASE = { cls:1, coef:1, set:1, pho:1, jex:1, pta:1 };
  if (k === 'tfl') return /^brand/.test(str_(row[0])) ? row : null;
  if (k === 'tch') { if (role !== 'teacher') { o[2] = ''; return o; } return cd(0) === u.code ? o : null; }
  if (role === 'student') {
    const own = i => cd(i) === u.code, mate = i => ctx.pseudo[cd(i)] !== undefined, ps = (ci, ni) => { if (!own(ci)) { o[ci] = ctx.pseudo[cd(ci)]; if (ni != null) o[ni] = 'هم‌کلاسی'; } return o; };
    if (BASE[k]) return row;
    switch (k) {
      case 'stu': if (!mate(0)) return null; if (!own(0)) { o[0] = ctx.pseudo[cd(0)]; o[1] = 'هم‌کلاسی'; o[3] = ''; } return o;
      case 'sch': return clsKey_(row[0]) === ctx.ck ? o : null;
      case 'ses': return clsKey_(row[1]) === ctx.ck ? o : null;
      case 'exm': return clsKey_(row[2]) === ctx.ck ? o : null;
      case 'fac': return clsKey_(row[2]) === ctx.ck && String(row[6]).indexOf(u.code) >= 0 ? o : null;
      case 'att': case 'ant': case 'abj': return own(3) ? o : null;
      case 'gr': return mate(5) ? ps(5, 6) : null;
      case 'jsc': case 'ins': return mate(1) ? ps(1, 2) : null;
      case 'jpc': return mate(1) ? ps(1, null) : null;
      case 'tpf': case 'fcf': case 'csi': return own(0) ? o : null;
      case 'tup': case 'dap': case 'fee': case 'lrq': case 'ptr': case 'pvr': return own(1) ? o : null;
      case 'dsc': return own(2) ? o : null;
    }
    return null;
  }
  if (role === 'teacher') {
    if (BASE[k] && k !== 'pta') return o;
    switch (k) {
      case 'jsc': case 'jpc': case 'ins': return ctx.codes[cd(1)] ? o : null;
      case 'stu': if (!ctx.codes[cd(0)]) return null; o[3] = ''; return o;
      case 'sch': return cd(4) === u.code ? o : null;
      case 'ses': return cd(3) === u.code ? o : null;
      case 'att': case 'ant': return pair(1, 2) ? o : null;
      case 'gr': return pair(0, 1) ? o : null;
      case 'exm': return pair(2, 3) || cd(4) === u.code ? o : null;
      case 'fac': return pair(2, 3) ? o : null;
      case 'gpc': return cd(6) === u.code ? o : null;
      case 'abj': return pair(1, 2) ? o : null;
      case 'lrq': return ctx.codes[cd(1)] ? o : null;
    }
    return null;
  }
  if (role === 'counselor') {                      // مشاور همه‌ی دانش‌آموزان را می‌بیند، ولی نه امور مالی و ثبت‌های مشاوران دیگر
    if (['mgr', 'fee', 'fcf', 'sms', 'alg', 'stf', 'gpc', 'dap', 'gal'].indexOf(k) >= 0) return null;
    if (k === 'cnl') return cd(0) === u.code ? o : null;
    if (k === 'cns') return code_(row[10]) === u.code ? o : null;
    return o;
  }
  return null;
}
function offMeta_(u) {
  const sheets = Object.keys(SH).map(k => ({ k, name:SH[k], head:HEADS[k], n:Math.max(0, sheet_(k).getLastRow() - 1) }));
  return { status:'ok', sheets, version:VERSION, school:settings_().school, built:todayJ_() + ' ' + nowHM_(), who:{ role:u.role, code:u.code } };
}
function offSheet_(u, p) {                         // بخشی از ردیف‌های یک برگه؛ حجم هر پاسخ محدود است
  const k = str_(p.k); if (!SH[k]) return err_('برگه‌ی نامعتبر.');
  if (u.imp) return err_('در حالت مشاهده‌ی پنل نمی‌توان نسخه‌ی آفلاین ساخت.');
  const ctx = offCtx_(u), sh = sheet_(k), total = Math.max(0, sh.getLastRow() - 1), from = Math.max(0, Number(p.from) || 0), w = Math.max(sh.getLastColumn ? sh.getLastColumn() : 0, HEADS[k].length), step = ctx.all ? 100 : 500;
  const out = []; let size = 0, i = from;
  while (i < total && size < 1500000) {
    const n = Math.min(step, total - i), vals = sh.getRange(2 + i, 1, n, w).getValues();
    for (let j = 0; j < vals.length; j++) {
      i++; const row = offRow_(ctx, k, offClean_(k, vals[j]));
      if (row) { out.push(row); size += JSON.stringify(row).length; }
      if (size >= 1500000) break;
    }
  }
  return { status:'ok', rows:out, next:i, done:i >= total };
}
function offHtml_(u) {
  return { status:'ok', html:HtmlService.createHtmlOutputFromFile('index').getContent() };
}

function doGet() {
  let title = 'سامانه مدرسه';
  try { title += ' — ' + settings_().school; } catch (x) {}
  try {
    return HtmlService.createHtmlOutputFromFile('index')
      .setTitle(title)
      .addMetaTag('viewport', 'width=device-width, initial-scale=1, viewport-fit=cover')
      .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL);
  } catch (x) {
    // به‌جای صفحه‌ی خالی، دلیل دقیق را نشان بده
    const msg = String(x && x.message ? x.message : x).replace(/[&<>]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[c]));
    return HtmlService.createHtmlOutput(
      '<div dir="rtl" style="font:16px/2 Tahoma,sans-serif;padding:24px;max-width:640px">' +
      '<b>بک‌اند سامانه فعال است (' + VERSION + ')، ولی صفحه‌ی اپ باز نشد.</b><br>' +
      'در پروژه‌ی Apps Script باید یک فایل HTML دقیقاً به نام <b>index</b> باشد.<br>' +
      'پیام خطا: <code dir="ltr">' + msg + '</code></div>').setTitle('سامانه مدرسه');
  }
}

function handle_(p) {
  try {
    if (!p || typeof p !== 'object') return err_('درخواست نامعتبر است.');
    if (p.action === 'ping') { const st = settings_(); return { status:'ok', school:st.school, version:VERSION, appName:st.appName, slogan:st.slogan, logoV:st.logoV, heroV:st.heroV }; }
    if (p.action === 'brandImg') { const k = p.kind === 'hero' ? 'brand_hero' : p.kind === 'banner' ? 'brand_banner' : 'brand_logo'; return { status:'ok', img:tflGet_(k) || '' }; }
    if (p.action === 'login') return login_(p);
    const u = auth_(p.token);
    if (!u) return { status:'auth', message:'نشست شما منقضی شده است؛ دوباره وارد شوید.' };
    if (p.action === 'logout') { if (!u.imp) log_(u, 'خروج', 'خروج از سامانه'); return { status:'ok' }; }
    if (u.imp && p.action === 'myPass') return err_('در حالت مشاهده‌ی پنل نمی‌توان رمز را تغییر داد.');
    if (p.action !== 'myPass' && !u.imp && mustChange_(u)) return { status:'mustchange', message:'برای ادامه، ابتدا رمز پیش‌فرض را عوض کنید.' };
    const a = (actions_()[u.role] || {})[p.action];
    if (!a) return err_('به این بخش دسترسی ندارید.');
    if (a.w && u.imp && u.role === 'counselor') return err_('در حالت مشاهده‌ی پنل مشاور فقط مشاهده ممکن است.');
    if (!a.w) return a.fn(u, p);
    const lock = LockService.getScriptLock();
    lock.waitLock(20000);
    try { const r = a.fn(u, p); logAct_(u, p, r); return r; } finally { lock.releaseLock(); }
  } catch (x) {
    return err_('خطای سرور: ' + (x && x.message ? x.message : x));
  }
}
// وقتی index.html روی سایت دیگری است (fetch به آدرس Web App)
function doPost(e) {
  let p;
  try { p = JSON.parse(e.postData.contents); } catch (x) { return out_(err_('درخواست نامعتبر است.')); }
  return out_(handle_(p));
}
// وقتی اپ از خود Apps Script باز شده است (google.script.run)
function api(json) {
  let p;
  try { p = JSON.parse(json); } catch (x) { return JSON.stringify(err_('درخواست نامعتبر است.')); }
  return JSON.stringify(handle_(p));
}

/* ---------- راه‌اندازی و به‌روزرسانی ---------- */
// تابع‌های setup و resetAdmin فقط باید از ویرایشگر و توسط صاحب اسکریپت اجرا شوند، نه از داخل اپ
function ownerOnly_() {
  const a = Session.getActiveUser().getEmail(), e = Session.getEffectiveUser().getEmail();
  if (!a || a !== e) throw new Error('این تابع فقط از ویرایشگر Apps Script اجرا می‌شود.');
}
// بعد از هر به‌روزرسانی کد هم یک‌بار اجرا شود: برگه‌های تازه و ستون‌های تازه ساخته می‌شوند و داده‌ها می‌مانند
function setup() {
  ownerOnly_();
  Object.keys(SH).forEach(k => {
    const sh = sheet_(k);
    TEXT_COLS[k].forEach(a => sh.getRange(a).setNumberFormat('@'));
    sh.getRange(1, 1, 1, HEADS[k].length).setValues([HEADS[k]]).setFontWeight('bold');
  });
  Object.keys(MEMO).forEach(k => delete MEMO[k]);
  Object.keys(SH).forEach(forget_);
  secret_();
  try { backupWeekly(); } catch (e) {}              // تریگر پشتیبان قدیمی را (در صورت وجود) حذف می‌کند
  if (!users_('manager').length) {
    const code = code_(ADMIN_CODE), pass = DEFAULT_PASS;
    append_('mgr', [[code, ADMIN_NAME, hash_('manager', code, pass), enc_(pass)]]);
  }
  // برگه‌ی خالی پیش‌فرض (Sheet1 / برگه۱) حذف می‌شود
  const ss = SpreadsheetApp.getActiveSpreadsheet(), first = ss.getSheets()[0], names = Object.keys(SH).map(k => SH[k]);
  if (names.indexOf(first.getName()) < 0 && first.getLastRow() === 0 && ss.getSheets().length > 1) ss.deleteSheet(first);
}
// اگر رمز مدیر اصلی فراموش شد: این تابع را از ویرایشگر یک‌بار Run کنید؛ رمز admin به ۱۲۳۴۵۶ برمی‌گردد
// و مدیر در ورود بعدی مجبور است رمز تازه بگذارد. (مدیر دیگری هم می‌تواند رمز مدیران را از زبانه‌ی «مدیران» به پیش‌فرض برگرداند.)
function resetAdmin() {
  ownerOnly_();
  const code = code_(ADMIN_CODE), pass = DEFAULT_PASS, x = findUser_('manager', code);
  if (!x) { append_('mgr', [[code, ADMIN_NAME, hash_('manager', code, pass), enc_(pass)]]); return; }
  setPass_(x, pass);
}
